name: Redwood Ownership Transaction Acquisition

on:
  push:
    paths:
      - ".github/workflows/redwood-ownership-transaction-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Discover and acquire current CMS ownership and enrollment datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ownership
          python3 - <<'PY'
          import csv, json, os, re, hashlib, urllib.request, urllib.parse, shutil

          ROOT="ownership"
          UA={"User-Agent":"Redwood-Research-Acquisition/0.7"}

          targets=[
              ("hospital_chow",["hospital change of ownership"],["owner information"]),
              ("hospital_chow_owner",["hospital change of ownership","owner"],[]),
              ("hospital_all_owners",["hospital all owners"],[]),
              ("hospital_enrollments",["hospital enrollments"],[]),
              ("asc_all_owners",["ambulatory surgical center","all owners"],[]),
              ("asc_enrollments",["ambulatory surgical center","enrollments"],[]),
              ("fqhc_all_owners",["federally qualified health center","all owners"],[]),
              ("fqhc_enrollments",["federally qualified health center","enrollments"],[]),
              ("rhc_all_owners",["rural health clinic","all owners"],[]),
              ("rhc_enrollments",["rural health clinic","enrollments"],[]),
          ]

          def get(url,timeout=180):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read()

          def download(url,dest):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=900) as r, open(dest,"wb") as f:
                  shutil.copyfileobj(r,f,1024*1024)
              return os.path.getsize(dest)

          def norm(s):
              return re.sub(r"[^a-z0-9]+"," ",str(s or "").lower()).strip()

          def csv_distribution(ds):
              out=[]
              for d in ds.get("distribution",[]) or []:
                  url=d.get("downloadURL")
                  if not url:
                      continue
                  probe=" ".join([norm(d.get("format")),norm(d.get("mediaType")),norm(d.get("title")),norm(url)])
                  if "csv" in probe:
                      out.append(d)
              return out[0] if out else None

          catalog=json.loads(get("https://data.cms.gov/data.json"))
          datasets=catalog.get("dataset",[])
          with open(os.path.join(ROOT,"CMS_CATALOG_MATCHING_TITLES.txt"),"w",encoding="utf-8") as f:
              for ds in datasets:
                  title=str(ds.get("title") or "")
                  low=title.lower()
                  if any(k in low for k in ["ownership","owners","enrollments"]):
                      f.write(title+"\n")

          manifest=[]
          for slug,must,exclude in targets:
              candidates=[]
              for ds in datasets:
                  title=norm(ds.get("title"))
                  if all(norm(term) in title for term in must) and not any(norm(term) in title for term in exclude):
                      candidates.append(ds)
              candidates.sort(key=lambda x:(str(x.get("modified") or ""),str(x.get("title") or "")),reverse=True)
              if not candidates:
                  manifest.append({"slug":slug,"status":"NOT_FOUND"})
                  continue
              ds=candidates[0]
              dist=csv_distribution(ds)
              rec={
                  "slug":slug,
                  "title":ds.get("title"),
                  "identifier":str(ds.get("identifier") or ds.get("@id") or ""),
                  "landingPage":ds.get("landingPage"),
                  "modified":ds.get("modified"),
                  "issued":ds.get("issued"),
                  "downloadURL":dist.get("downloadURL") if dist else None,
                  "describedBy":dist.get("describedBy") if dist else None,
              }
              folder=os.path.join(ROOT,slug)
              os.makedirs(folder,exist_ok=True)
              with open(os.path.join(folder,"SOURCE.json"),"w",encoding="utf-8") as f:
                  json.dump(rec,f,indent=2,sort_keys=True)

              if not dist:
                  rec["status"]="NO_CSV_DISTRIBUTION"
                  manifest.append(rec)
                  continue

              url=dist["downloadURL"]
              raw=os.path.join(folder,"SOURCE.csv")
              try:
                  size=download(url,raw)
                  h=hashlib.sha256()
                  with open(raw,"rb") as f:
                      for block in iter(lambda:f.read(1024*1024),b""):
                          h.update(block)
                  rec["bytes"]=size
                  rec["sha256"]=h.hexdigest()
                  rec["status"]="ACQUIRED_FULL"
                  # deterministic bounded inspection fixture
                  with open(raw,"r",encoding="utf-8-sig",errors="replace") as src, open(os.path.join(folder,"FIRST_10000_ROWS.csv"),"w",encoding="utf-8") as out:
                      for i,line in enumerate(src):
                          out.write(line)
                          if i>=10000:
                              break
                  if rec.get("describedBy"):
                      try:
                          with open(os.path.join(folder,"DATA_DICTIONARY"),"wb") as f:
                              f.write(get(rec["describedBy"],120))
                      except Exception as e:
                          with open(os.path.join(folder,"DATA_DICTIONARY_ERROR.txt"),"w") as f:
                              f.write(str(e))
              except Exception as e:
                  rec["status"]="DOWNLOAD_FAILED"
                  rec["error"]=repr(e)

              with open(os.path.join(folder,"RECEIPT.json"),"w",encoding="utf-8") as f:
                  json.dump(rec,f,indent=2,sort_keys=True)
              manifest.append(rec)

          with open(os.path.join(ROOT,"MANIFEST.json"),"w",encoding="utf-8") as f:
              json.dump(manifest,f,indent=2,sort_keys=True)

          fields=["slug","status","title","identifier","modified","issued","bytes","sha256","landingPage","downloadURL","error"]
          with open(os.path.join(ROOT,"MANIFEST.csv"),"w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore")
              w.writeheader()
              w.writerows(manifest)

          lines=[
              "# Redwood CMS Ownership / CHOW / Enrollment Corpus",
              "",
              "Current public CMS ownership and enrollment evidence acquired from the live data.cms.gov catalog.",
              "",
              "Use: transaction/ownership-change context; buyer/seller and effective-date simulation; facility/practice-affiliation context; acquisition/same-store scenarios; identifier-linkage tests.",
              "",
              "Limits: public facility ownership does not by itself prove physician-practice ownership; CHOW context is not a QoR conclusion; commercial M&A databases remain separately licensed.",
              ""
          ]
          with open(os.path.join(ROOT,"README.md"),"w",encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

      - name: Upload control manifest
        uses: actions/upload-artifact@v4
        with:
          name: redwood-cms-ownership-control
          path: |
            ownership/MANIFEST.json
            ownership/MANIFEST.csv
            ownership/README.md
            ownership/CMS_CATALOG_MATCHING_TITLES.txt
          retention-days: 1

      - name: Upload hospital CHOW
        uses: actions/upload-artifact@v4
        with:
          name: redwood-hospital-chow
          path: ownership/hospital_chow/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload hospital CHOW owner
        uses: actions/upload-artifact@v4
        with:
          name: redwood-hospital-chow-owner
          path: ownership/hospital_chow_owner/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload hospital owners
        uses: actions/upload-artifact@v4
        with:
          name: redwood-hospital-all-owners
          path: ownership/hospital_all_owners/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload hospital enrollments
        uses: actions/upload-artifact@v4
        with:
          name: redwood-hospital-enrollments
          path: ownership/hospital_enrollments/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload ASC owners
        uses: actions/upload-artifact@v4
        with:
          name: redwood-asc-all-owners
          path: ownership/asc_all_owners/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload ASC enrollments
        uses: actions/upload-artifact@v4
        with:
          name: redwood-asc-enrollments
          path: ownership/asc_enrollments/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload FQHC owners
        uses: actions/upload-artifact@v4
        with:
          name: redwood-fqhc-all-owners
          path: ownership/fqhc_all_owners/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload FQHC enrollments
        uses: actions/upload-artifact@v4
        with:
          name: redwood-fqhc-enrollments
          path: ownership/fqhc_enrollments/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload RHC owners
        uses: actions/upload-artifact@v4
        with:
          name: redwood-rhc-all-owners
          path: ownership/rhc_all_owners/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload RHC enrollments
        uses: actions/upload-artifact@v4
        with:
          name: redwood-rhc-enrollments
          path: ownership/rhc_enrollments/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
