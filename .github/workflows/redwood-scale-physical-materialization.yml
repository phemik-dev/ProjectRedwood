            scale/10m/payments/Payments_Raw_part_012.csv.gz
            scale/10m/payments/Payments_Raw_part_013.csv.gz
            scale/10m/payments/Payments_Raw_part_014.csv.gz
            scale/10m/payments/Payments_Raw_part_015.csv.gz
          retention-days: 1
          compression-level: 0

      - name: Upload 10M payments 016-020
        uses: actions/upload-artifact@v4
        with:
