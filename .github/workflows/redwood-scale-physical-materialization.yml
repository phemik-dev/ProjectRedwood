            scale/10m/claims/Claims_Raw_part_007.csv.gz
            scale/10m/claims/Claims_Raw_part_008.csv.gz
            scale/10m/claims/Claims_Raw_part_009.csv.gz
            scale/10m/claims/Claims_Raw_part_010.csv.gz
          retention-days: 1
          compression-level: 0

      - name: Upload 10M claims 011-015
        uses: actions/upload-artifact@v4
        with:
          name: redwood-scale-10m-claims-011-015
          path: |
            scale/10m/claims/Claims_Raw_part_011.csv.gz
            scale/10m/claims/Claims_Raw_part_012.csv.gz
            scale/10m/claims/Claims_Raw_part_013.csv.gz
            scale/10m/claims/Claims_Raw_part_014.csv.gz
            scale/10m/claims/Claims_Raw_part_015.csv.gz
          retention-days: 1
          compression-level: 0

      - name: Upload 10M claims 016-020
        uses: actions/upload-artifact@v4
        with:
          name: redwood-scale-10m-claims-016-020
          path: |
