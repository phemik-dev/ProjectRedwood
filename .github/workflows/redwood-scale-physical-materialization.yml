            scale/10m/claims/Claims_Raw_part_017.csv.gz
            scale/10m/claims/Claims_Raw_part_018.csv.gz
            scale/10m/claims/Claims_Raw_part_019.csv.gz
            scale/10m/claims/Claims_Raw_part_020.csv.gz
          retention-days: 1
          compression-level: 0

      - name: Upload 10M payments 001-005
        uses: actions/upload-artifact@v4
        with:
          name: redwood-scale-10m-payments-001-005
          path: |
            scale/10m/payments/Payments_Raw_part_001.csv.gz
            scale/10m/payments/Payments_Raw_part_002.csv.gz
            scale/10m/payments/Payments_Raw_part_003.csv.gz
            scale/10m/payments/Payments_Raw_part_004.csv.gz
            scale/10m/payments/Payments_Raw_part_005.csv.gz
          retention-days: 1
          compression-level: 0

      - name: Upload 10M payments 006-010
        uses: actions/upload-artifact@v4
        with:
          name: redwood-scale-10m-payments-006-010
          path: |
            scale/10m/payments/Payments_Raw_part_006.csv.gz
            scale/10m/payments/Payments_Raw_part_007.csv.gz
            scale/10m/payments/Payments_Raw_part_008.csv.gz
            scale/10m/payments/Payments_Raw_part_009.csv.gz
            scale/10m/payments/Payments_Raw_part_010.csv.gz
          retention-days: 1
          compression-level: 0

      - name: Upload 10M payments 011-015
        uses: actions/upload-artifact@v4
        with:
